name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://www.maviproyectos.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: pnpm vía corepack
        run: corepack enable

      - name: Caché de pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Instalar (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Secretos (secretlint)
        run: pnpm secrets

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Auditoría de dependencias de producción
        run: pnpm audit --prod --audit-level=moderate

      - name: Build
        run: pnpm build

      - name: Navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pruebas E2E + accesibilidad
        run: pnpm test:e2e

      - name: Lighthouse CI (móvil, presupuestos)
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
        run: pnpm exec lhci autorun

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
